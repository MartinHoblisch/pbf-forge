name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0

        with:
          python-version: "3.12"
      # Pinned to the same version as .pre-commit-config.yaml — an unpinned
      # ruff here let CI formatting drift away from the local hooks.
      - run: pip install ruff==0.15.21
      - run: ruff check backend/
      - run: ruff format --check backend/

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0

        with:
          python-version: "3.12"
      - name: Install system deps for osmium Python bindings
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-python-dev osmium-tool
      - name: Install Python deps
        run: pip install -r backend/requirements.txt
      - name: Install test extras
        run: pip install pytest pytest-cov pytest-asyncio httpx
      - name: Run tests
        working-directory: backend
        run: pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python deps (skip osmium — no Windows wheels)
        shell: pwsh
        run: |
          (Get-Content backend\requirements.txt) |
            Where-Object { $_ -notmatch '^\s*osmium' -and $_.Trim() -ne '' } |
            Set-Content backend\requirements-win-tmp.txt
          pip install -r backend\requirements-win-tmp.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      - name: Run tests (platform-safe subset)
        working-directory: backend
        run: pytest tests/ -m "not docker and not posix and not integration"

  launcher-smoke-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Verify start.bat structure
        shell: pwsh
        run: |
          $content = Get-Content start.bat -Raw
          if ($content -notmatch 'docker compose') {
            Write-Error 'start.bat: missing docker compose call'; exit 1
          }
          if ($content -notmatch 'docker info') {
            Write-Error 'start.bat: missing docker info check'; exit 1
          }
          Write-Host "start.bat structure OK"

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck start.sh stop.sh

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Build image (smoke test)
        run: docker build . --tag pbf-forge:smoke
