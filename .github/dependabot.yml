version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly

  # Bumping the ruff rev here also moves the CI lint job, which reads the
  # version out of .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly

  # osmium-tool and gdal-bin come from the base image, so the digest pin is the
  # only lever over their versions.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Digest refreshes only. A tag bump would move osmium-tool, GDAL and
      # python3 across several releases at once — deliberate work, tracked in
      # issue #44, not something to land as an unreviewed dependency PR.
      - dependency-name: ubuntu
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Single PR for all action bumps. Sub-actions pinned to the same SHA
      # (e.g. github/codeql-action/{init,autobuild,analyze}) must move together,
      # otherwise CodeQL fails with a version mismatch.
      actions:
        patterns:
          - "*"
