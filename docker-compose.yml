services:
  pbf-forge:
    container_name: pbf-forge
    # The launchers fetch this image instead of building it, which turns a
    # first start from minutes into a download. The tag tracks VERSION in
    # backend/config.py, so a checkout and the image beside it always name the
    # same release. Only released versions are published: on a working copy
    # ahead of the last release, and on platforms with no published image, the
    # launchers fall back to the build below and produce the same image from
    # this source.
    image: ghcr.io/martinhoblisch/pbf-forge:1.2.2
    build: .
    # Bind to loopback only — never expose to LAN/public internet.
    # SECURITY.md non-goal: tool is auth-less; do not change to 0.0.0.0.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${DATA_DIR:-./data}:/data"
      - ./config:/app/config
    environment:
      - DATA_DIR=/data
      - HOST_DATA_DIR=${DATA_DIR:-./data}
    mem_limit: 4g
    memswap_limit: 4g
    # on-failure, not unless-stopped: the Quit button in the UI stops the server
    # with a clean exit, and any always-restart policy would immediately bring
    # the container back up. Crashes are still restarted.
    restart: on-failure
