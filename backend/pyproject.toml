[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that invoke real external binaries (osmium, ogr2ogr)",
    "docker: tests requiring Docker daemon or external binaries unavailable on Windows runners",
    "posix: tests using POSIX-only features (symlinks, fork, signals, chmod modes)",
]

[tool.coverage.run]
# Measure the application, not the test suite. `pytest --cov=.` from this
# directory would otherwise count tests/ as covered code, where the only
# unreached lines are the failure branches that fire when a test finds a bug.
omit = ["tests/*"]
