repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Single source of truth for the ruff version — .github/workflows/ci.yml
    # reads this rev instead of carrying its own pin.
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown. Without this
        # the hook silently reflows docs that rely on them.
        args: [--markdown-linebreak-ext=md]
