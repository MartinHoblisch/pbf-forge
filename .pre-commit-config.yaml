repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Single source of truth for the ruff version — .github/workflows/ci.yml
    # reads this rev instead of carrying its own pin.
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
